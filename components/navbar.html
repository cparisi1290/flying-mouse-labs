<!-- NAVIGATION -->
<nav x-data="{ 
        open: false, 
        modalOpen: false, 
        show: true, 
        lastScrollY: 0 
    }" x-init="
        $watch('open', value => value ? document.body.classList.add('overflow-hidden') : document.body.classList.remove('overflow-hidden'));
        window.addEventListener('scroll', () => {
            if (open || modalOpen) return; 
            const currentScrollY = window.pageYOffset;
            show = currentScrollY < lastScrollY || currentScrollY < 50;
            lastScrollY = currentScrollY;
        });
    " @toggle-form.window="modalOpen = $event.detail.open" @modal-state.window="modalOpen = $event.detail.open"
    class="fixed lg:absolute top-0 left-0 w-full z-50 transition-all duration-500 ease-in-out" :class="{
        /* 1. HIDE if modal is open OR if scrolling down (and menu is NOT open) */
        '-translate-y-full shadow-none': modalOpen || (!show && !open), 
        
        /* 2. SHOW if menu is open OR if scrolling up/at top (and modal is NOT open) */
        'translate-y-0' : (open || show) && !modalOpen
    }">
    <div class="hidden lg:flex justify-center pt-8 transition-transform duration-500">
        <div
            class="w-[80%] max-w-8xl bg-white/50 backdrop-blur-sm border border-white/20 shadow-[0_4px_24px_0_rgba(0,0,0,0.15)] rounded-3xl px-10 py-4 flex items-center justify-between">
            <div class="flex-shrink-0">
                <a href="#home" class="block leading-[0]">
                    <img src="assets/images/fml-logo-v1.svg" alt="Flying Mouse Labs" class="w-56 h-auto">
                </a>
            </div>

            <div class="flex items-center space-x-6">
                <a href="#services"
                    class="text-[11px] font-bold uppercase tracking-[0.2em] text-[#041A24] hover:opacity-60 transition-opacity">Services</a>
                <a href="#case-studies"
                    class="text-[11px] font-bold uppercase tracking-[0.2em] text-[#041A24] hover:opacity-60 transition-opacity">Case
                    Studies</a>
                <a href="#projects"
                    class="text-[11px] font-bold uppercase tracking-[0.2em] text-[#041A24] hover:opacity-60 transition-opacity">Project</a>
                <a href="#testimonials"
                    class="text-[11px] font-bold uppercase tracking-[0.2em] text-[#041A24] hover:opacity-60 transition-opacity">Testimonials</a>
                <a href="#about"
                    class="text-[11px] font-bold uppercase tracking-[0.2em] text-[#041A24] hover:opacity-60 transition-opacity">About</a>
                <a href="#contact"
                    class="bg-[#041A24] text-white text-[11px] font-bold uppercase tracking-[0.15em] px-8 py-4 rounded-full hover:scale-105 active:scale-95 transition-all shadow-lg">
                    Start Project
                </a>
            </div>
        </div>
    </div>

    <div class="lg:hidden flex items-center justify-between px-6 py-4 md:px-16 md:py-10 transition-all duration-500 relative z-20"
        style="background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(8px) saturate(180%); -webkit-backdrop-filter: blur(12px) saturate(180%); border-bottom: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 4px 24px 0 rgba(0, 0, 0, 0.15);">

        <div class="flex-shrink-0">
            <a href="#home" :class="open ? 'md:block' : 'block'" class="block leading-[0]">
                <img src="assets/images/fml-logo-v1.svg" alt="Flying Mouse Labs"
                    class="w-56 h-auto md:w-64 object-contain">
            </a>
        </div>

        <button @click="open = !open" class="focus:outline-none flex flex-col items-center group relative z-[110]">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                class="w-12 h-12 md:w-16 md:h-16 transition-all duration-300" style="stroke-width: 1.5;">
                <path x-show="!open" d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </button>
    </div>

    <div x-show="open" x-cloak x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
        x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        class="fixed inset-0 w-full h-screen bg-white/95 md:w-1/2 md:left-auto md:right-0 md:rounded-2xl backdrop-blur-2xl z-[100] flex flex-col items-center justify-center">

        <div class="absolute top-4 left-6 md:hidden">
            <a href="#home" @click="open = false" class="block leading-[0]">
                <img src="assets/images/fml-logo-v1.svg" alt="Flying Mouse Labs" class="w-56 h-auto object-contain">
            </a>
        </div>

        <button @click="open = false" class="absolute top-10 right-6 md:top-16 md:right-16 focus:outline-none">
            <svg class="w-12 h-12 md:w-16 md:h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path d="M6 18L18 6M6 6l12 12" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </button>

        <div
            class="flex-grow flex flex-col items-center justify-center md:justify-start pt-24 md:mt-32 space-y-10 pb-20">
            <a href=" #services" @click="open = false"
                class="text-2xl md:text-3xl md:font-mono font-bold uppercase text-brand-dark">Services</a>
            <a href="#case-studies" @click="open = false"
                class="text-2xl md:text-3xl md:font-mono font-bold uppercase text-brand-dark">Case
                Studies</a>
            <a href="#project" @click="open = false"
                class="text-2xl md:text-3xl md:font-mono font-bold uppercase text-brand-dark">Project</a>
            <a href="#testimonials" @click="open = false"
                class="text-2xl md:text-3xl md:font-mono font-bold uppercase text-brand-dark">Testimonials</a>
            <a href="#about" @click="open = false"
                class="text-2xl md:text-3xl md:font-mono font-bold uppercase text-brand-dark">About</a>
            <div class="pt-6">
                <a href="#contact" @click="open = false"
                    class="px-12 py-4 bg-[#041A24] md:font-mono text-white font-bold tracking-[0.1em] uppercase rounded-full shadow-2xl active:scale-95 transition-transform inline-block">
                    Start Project
                </a>
            </div>
        </div>
    </div>
</nav>
