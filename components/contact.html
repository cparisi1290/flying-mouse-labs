<section id="contact" x-data="{ 
            open: false,
            email: '', 
            services: [],
            formHTML: '',
            subscribed: false,
            showError: false,
            loading: false,
            validate() {
                // 1. Domain Check
                const personalDomains = ['gmail.com', 'yahoo.com', 'hotmail.com', 'outlook.com', 'aol.com'];
                const parts = this.email.split('@');
                const domain = parts.length > 1 ? parts[1].toLowerCase() : null;
    
                if (!domain || personalDomains.includes(domain)) {
                    this.showError = true;
                    setTimeout(() => { this.showError = false }, 4000);
                } else {

                    // 2. Start Loading
                    this.showError = false;
                    this.loading = true;

                    // 3. Simulate Submission & Trigger Calendar
                    setTimeout(() => {
                        this.loading = false;
                        this.subscribed = true;
                        
                        if(this.open) {
                            setTimeout(() => {
                                this.open = false;
                                document.body.style.overflow = 'auto';
                            }, 2500);
                        }
                    }, 2000);
                }
            },
            // Inside your Contact Form x-data
            toggleContact(state) {
            this.contactOpen = state;
            document.body.style.overflow = state ? 'hidden' : 'auto';
            
            // Dispatch the same event the Nav is already listening for
            window.dispatchEvent(new CustomEvent('modal-state', {
            detail: { open: state }
            }));
            },
            async loadForm() {
                const response = await fetch('components/contact-form.html');
                this.formHTML = await response.text();

                if (!response.ok) {
                    console.error('Form not found at: components/contact-form.html');
                }
            }
        }" x-init=" loadForm()" class="min-h-screen py-32 bg-arctic-lab bg-[length:400%_400%] animate-bgShift [perspective:2000px] flex flex-col items-center justify-center text-center px-6 relative
        overflow-hidden">

    <!-- MOBILE + TABLET -->
    <div class="glass-cube lg:hidden c1-mobile absolute"></div>
    <div class="glass-cube lg:hidden c2-mobile absolute"></div>
    <div class="glass-cube lg:hidden c3-mobile absolute"></div>
    <div class="glass-cube lg:hidden c4-mobile absolute"></div>
    <div class="glass-cube lg:hidden c5-mobile absolute"></div>
    <div class="glass-cube lg:hidden c6-mobile absolute"></div>
    <div class="glass-cube lg:hidden c7-mobile absolute"></div>

    <!-- DESKTOP -->
    <div class="glass-cube hidden lg:block c1 absolute"></div>
    <div class="glass-cube hidden lg:block c2 absolute"></div>
    <div class="glass-cube hidden lg:block c3 absolute"></div>
    <div class="glass-cube hidden lg:block c4 absolute"></div>
    <div class="glass-cube hidden lg:block c5 absolute"></div>
    <div class="glass-cube hidden lg:block c6 absolute"></div>
    <div class="glass-cube hidden lg:block c7 absolute"></div>

    <div class="container mx-auto px-6 lg:px-12 xl:px-24 relative z-20">

        <!-- MOBILE + TABLET -->
        <div class="lg:hidden flex flex-col items-center text-center">
            <h2 class="text-5xl md:text-6xl font-black text-slate-950 leading-tight uppercase tracking-tighter mb-4">
                Let's build something <br><span class="text-sky-600">Extraordinary.</span>
            </h2>
            <p class="text-slate-950 text-lg font-medium max-w-sm opacity-90 mb-10">
                Fill out the inquiry form, and we'll get back to you within 24 hours.
            </p>
            <button
                @click="open = true; document.body.style.overflow = 'hidden'; $dispatch('toggle-form', { open: true })"
                class="bg-slate-950 hover:bg-sky-500 hover:scale-105 text-white px-12 py-5 rounded-full text-xs font-black uppercase tracking-[0.2em] shadow-xl hover:bg-sky-900 transition-all">
                Launch Your Project
            </button>
        </div>

        <!-- DESKTOP-->
        <div class="hidden lg:flex items-start justify-between gap-16 max-w-7xl mx-auto">
            <div class="w-1/2 text-left mt-20">
                <h2 class="text-7xl font-black text-slate-950 leading-[0.85] uppercase tracking-tighter mb-8">
                    Let's build<br>something<br><span class="text-sky-600">Extraordinary.</span>
                </h2>
                <p class="text-slate-950 text-xl font-medium max-w-sm opacity-90">
                    Fill out the inquiry form, and we'll get back to you within 24 hours.
                </p>
            </div>

            <div class="w-1/2 max-w-xl">
                <div class="bg-white/70 backdrop-blur-2xl border border-white/40 p-12 rounded-[50px] shadow-2xl">
                    <div id="form-content-source">

                        <template x-if="!formHTML">
                            <div
                                class="flex items-center justify-center p-12 text-gray-400 font-mono text-xs uppercase tracking-widest">
                                <svg class="animate-spin h-5 w-5 mr-3" ...></svg>
                                Syncing Form...
                            </div>
                        </template>

                        <div x-cloak x-html="formHTML"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MOBILE + TABLET -->
    <template x-if="open">
        <div class="fixed inset-0 z-[150] flex items-start overflow-y-auto justify-center p-4 py-12 md:py-20 bg-slate-950/10 backdrop-blur-sm"
            @click.self="open = false; document.body.style.overflow = 'auto'"
            x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 scale-95"
            x-transition:enter-end="opacity-100 scale-100">

            <div class="bg-[#F3F4F6] w-full max-w-2xl rounded-[40px] shadow-2xl relative no-scrollbar">

                <button
                    @click="open = false; document.body.style.overflow = 'auto'; $dispatch('toggle-form', { open: false })"
                    class="absolute top-6 right-6 z-50 p-2 bg-white/80 backdrop-blur-md rounded-full border border-gray-100 shadow-sm">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>

                <div class="p-8 md:p-12 pt-16">
                    <div class="text-left mb-10">
                        <h2
                            class="text-3xl md:text-4xl font-black text-slate-950 uppercase tracking-tight leading-none mb-3">
                            Let's Build Something <br><span class="text-sky-500">Extraordinary.</span>
                        </h2>
                        <p class="text-gray-500 text-sm font-medium">Fill out the form below and we'll get back
                            to
                            you
                            within 24 hours.</p>
                    </div>

                    <template x-if="!formHTML">
                        <div
                            class="flex items-center justify-center p-12 text-gray-400 font-mono text-xs uppercase tracking-widest">
                            <svg class="animate-spin h-5 w-5 mr-3" ...></svg>
                            Syncing Form...
                        </div>
                    </template>

                    <div x-cloak x-html="formHTML"></div>
                </div>
            </div>
        </div>
    </template>

    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>

</section>
