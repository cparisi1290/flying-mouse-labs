<header x-data="{ 
        mobileMenuOpen: false,
        currentPage: window.location.pathname.split('/').pop() || 'index.html'
    }"
    class="bg-light-text py-6 px-6 md:px-12 shadow-[0_2px_15px_-3px_rgba(0,0,0,0.07)] border-b border-gray-100 sticky md:relative top-0 z-50">

    <div class="w-full mx-auto flex justify-between items-center relative z-[60]">
        <a href="index.html" class="flex flex-col md:ml-20 lg:ml-40 transition-all hover:opacity-80">
            <h2 class="text-3xl font-bold tracking-tight text-deep-plum">
                SILVER<span class="text-plum">TREE</span>
            </h2>
            <p class="text-[10px] uppercase tracking-[0.2em] text-gray-500 font-semibold ml-1">
                Business Consulting
            </p>
        </a>

        <nav class="hidden md:flex items-center space-x-10 text-dark-text font-medium">
            <a href="services.html" :class="currentPage === 'services.html' ? 'text-copper' : ''"
                class="hover:text-copper transition-colors font-semibold">Services</a>
            <a href="case-studies.html" :class="currentPage === 'case-studies.html' ? 'text-copper' : ''"
                class="hover:text-copper transition-colors font-semibold">Case Studies</a>
            <a href="about.html" :class="currentPage === 'about.html' ? 'text-copper' : ''"
                class="hover:text-copper transition-colors font-semibold">About</a>
            <a href="https://calendly.com/mosaicbusinesssolutionsllc" target="_blank"
                class="bg-deep-plum text-light-text px-4 py-2 rounded-[50px] font-semibold text-center hover:scale-105 transition-transform border border-deep-plum w-full md:w-48 shadow-xl">
                Schedule Call
            </a>
        </nav>

        <div class="md:hidden">
            <button @click="mobileMenuOpen = !mobileMenuOpen" class="text-deep-plum focus:outline-none p-2">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path x-show="!mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 6h16M4 12h16M4 18h16" />
                    <path x-show="mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>

    <div x-show="mobileMenuOpen" @click.away="mobileMenuOpen = false"
        x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 -translate-y-4"
        x-transition:enter-end="opacity-100 translate-y-0" x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="opacity-100 translate-y-0" x-transition:leave-end="opacity-0 -translate-y-4"
        class="md:hidden bg-light-text border-t border-gray-100 fixed inset-0 w-full h-full shadow-2xl z-50">

        <nav class="flex flex-col items-center justify-center h-full py-12 px-6 space-y-8">
            <a href="services.html" :class="currentPage === 'services.html' ? 'text-copper' : ''"
                class="text-xl text-dark-text font-semibold">Services</a>
            <a href="case-study.html" :class="currentPage === 'case-study.html' ? 'text-copper' : ''"
                class="text-xl text-dark-text font-semibold">Case Study</a>
            <a href="about.html" :class="currentPage === 'about.html' ? 'text-copper' : ''"
                class="text-xl text-dark-text font-semibold">About</a>
            <a href="contact.html" :class="currentPage === 'contact.html' ? 'text-copper' : ''"
                class="text-xl text-dark-text font-semibold pb-6">Contact</a>

            <a href="https://calendly.com/mosaicbusinesssolutionsllc"
                class="w-full max-w-xs py-2 bg-deep-plum text-light-text text-center rounded-full font-semibold text-lg shadow-lg shadow-xl">
                Schedule Call
            </a>
        </nav>
    </div>
</header>
