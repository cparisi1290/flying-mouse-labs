<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silver Tree | Page Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'deep-plum': '#664875',
                        'copper': '#d9ac88',
                        'powder-blue': '#bdd4e0',
                        'blue': '#4e70af',
                        'warm-grey': '#cabcb0',
                        'dark-grey': '#4a4a4ab7',
                        'light-text': '#f7f5f3',
                        'dark-text': '#160F1A',
                        'plum': '#9b7eac',
                    },
                    fontFamily: {
                        'serif': ['DM Serif Display', 'serif'],
                        'sans': ['Poppins', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="./assets/css/main.css">
</head>

<body class="font-sans bg-light-text text-dark-text antialiased">


    <!-- Navigation will be injected here -->
    <div id="nav-placeholder"></div>
    <div class="container">
        <!-- 404 Error Content -->
        <section class="min-h-[60vh] flex items-center justify-center py-20 relative">
            <!-- Background Image -->
            <div class="absolute inset-0 bg-cover bg-center bg-no-repeat -z-10"
                style="background-image: url('./assets/images/contact-bg.jpg'); margin-left: calc(-50vw + 50%); width: 100vw; height: 100vh;">
            </div>

            <div class="text-center max-w-2xl mx-auto px-6 relative z-10">
                <!-- White Content Container -->
                <div class="bg-light-text p-12 rounded-[2.5rem] shadow-2xl">
                    <!-- 404 Number -->
                    <div class="mb-8">
                        <h1 class="text-8xl md:text-9xl font-bold text-deep-plum opacity-20">404</h1>
                    </div>

                    <!-- Error Message -->
                    <h2 class="text-4xl md:text-5xl font-serif font-bold text-dark-text mb-6">
                        Oops! Page Not Found
                    </h2>

                    <p class="text-lg text-dark-text mb-8 leading-relaxed max-w-lg mx-auto">
                        The page you're looking for seems to have vanished. Let's get you back on track to grow your
                        business.
                    </p>

                    <!-- Action Buttons -->
                    <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
                        <a href="index.html"
                            class="bg-deep-plum text-light-text px-8 py-4 rounded-full font-semibold hover:bg-opacity-90 transition-colors">

                            Back to Home
                        </a>
                        <a href="services.html"
                            class="border-2 border-deep-plum text-deep-plum px-8 py-4 rounded-full font-semibold hover:bg-deep-plum hover:text-light-text transition-all">

                            View Services
                        </a>
                    </div>

                    <!-- Helpful Links -->
                    <div class="mt-12 pt-8 border-t border-gray-200">
                        <p class="text-sm text-gray-500 mb-4">Looking for something specific?</p>
                        <div class="flex flex-wrap justify-center gap-4">
                            <a href="about.html" class="text-dark-text hover:text-copper transition-colors">
                                <i class="fas fa-users mr-1"></i> About Us
                            </a>
                            <a href="contact.html" class="text-dark-text hover:text-copper transition-colors">
                                <i class="fas fa-envelope mr-1"></i> Contact
                            </a>
                            <a href="https://calendly.com/mosaicbusinesssolutionsllc" target="_blank"
                                class="text-dark-text hover:text-copper transition-colors">
                                <i class="fas fa-calendar mr-1"></i> Schedule Call
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Footer will be injected here -->
    <div id="footer-placeholder"></div>

    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/main.js"></script>
</body>

</html>
