<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silver Tree | Our Services</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'deep-plum': '#664875',
                        'copper': '#d9ac88',
                        'powder-blue': '#bdd4e0',
                        'blue': '#4e70af',
                        'warm-grey': '#cabcb0',
                        'dark-grey': '#4a4a4ab7',
                        'light-text': '#f7f5f3',
                        'dark-text': '#160F1A',
                        'plum': '#9b7eac',
                    },
                    fontFamily: {
                        'serif': ['DM Serif Display', 'serif'],
                        'sans': ['Poppins', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="./assets/css/main.css">
</head>

<body>

    <div class="container">
        <!-- Navigation will be injected here -->
        <div id="nav-placeholder"></div>


        <!-- Page content will go here -->

        <!-- Testimonial will be injected here -->
        <div id="testimonial-placeholder"></div>

        <!-- CTA will be injected here -->
        <div id="cta-placeholder"></div>

        <!-- Footer will be injected here -->
        <div id="footer-placeholder"></div>
    </div>

    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/main.js"></script>
</body>

</html>
